<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Ayuta Health</title>
    <link rel="icon" href="../Images/Logo/ayuta_favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/site-base.css">
    <link rel="stylesheet" href="../styles/styles-account.css">
    <script src="../scripts/app-store.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js" defer></script>
    <script src="../scripts/auth-config.js" defer></script>
    <script src="../scripts/firebase-auth.js" defer></script>
    <script src="../scripts/nav-state.js" defer></script>
    <script src="../scripts/account-modal.js" defer></script>
    <script src="../scripts/include-nav.js" defer></script>
    <script src="../scripts/orders-page.js" defer></script>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main class="account-page">
        <div class="container">
            <div class="account-hero">
                <span class="eyebrow">Orders</span>
                <h1>Your orders</h1>
                <p>View everything you have purchased and track status in one place.</p>
            </div>

            <section class="account-card card account-lock" id="orders-locked">
                <h2>Sign in required</h2>
                <p class="account-status" id="orders-locked-status">Checking your session.</p>
                <div class="account-lock-actions">
                    <button class="btn btn-primary" type="button" data-login-trigger>Sign in</button>
                    <a class="btn btn-ghost" href="../index.html">Back home</a>
                </div>
            </section>

            <div class="account-grid" id="orders-authenticated" hidden>
                <div class="account-card card">
                    <h2>Status</h2>
                    <p class="account-status" id="orders-status">Sign in to view your orders.</p>
                </div>
                <div class="account-card card">
                    <h2>Recent orders</h2>
                    <div id="orders-list" class="order-list"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 Ayuta Ltd. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
